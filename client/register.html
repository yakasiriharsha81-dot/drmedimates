<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — myHealthMate AI</title>
  <meta name="description" content="Register for a new myHealthMate AI account with zero client-side sensitive health storage.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      padding: 38px;
    }
    .auth-topbar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-topbar">
    <div class="lang-select-wrapper">
      <select class="lang-selector" aria-label="Select Language">
        <option value="en">English</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="ta">தமிழ் (Tamil)</option>
      </select>
    </div>
  </div>

  <div class="glass-card auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html">
        <img src="assets/logo.svg" alt="myHealthMate AI" style="height: 42px; margin-bottom: 12px;">
      </a>
      <h2>Create Your Account</h2>
      <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 4px;">Join myHealthMate AI for transparent health insights</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-control" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-control" placeholder="jane.doe@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 8 characters" required minlength="8">
      </div>

      <div style="margin-bottom: 20px; font-size: 0.825rem; color: var(--text-secondary); display: flex; gap: 10px; align-items: flex-start;">
        <input type="checkbox" id="reg-consent" required style="margin-top: 3px;">
        <label for="reg-consent">
          I understand that myHealthMate AI provides educational explanations only and <strong>does not diagnose diseases or prescribe medications</strong>.
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Create Demonstration Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module">
    import { auth } from './js/auth.js';
    import { showToast } from './js/main.js';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;

      const res = await auth.register(name, email, pass);
      if (res.success) {
        showToast('Account Created', `Welcome to myHealthMate AI, ${res.user.name}!`, 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 700);
      }
    });
  </script>
</body>
</html>
