<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" width="260" height="64" role="img" aria-label="myHealthMate AI Logo">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoGradTealCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E6B8"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0AA981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#00E6B8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06111F" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow behind emblem -->
  <circle cx="32" cy="32" r="28" fill="url(#ringGlow)" />
  
  <!-- Outer Tech Ring -->
  <circle cx="32" cy="32" r="25" stroke="url(#logoGradTealCyan)" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="7 3"/>
  <circle cx="32" cy="32" r="21" stroke="#00D4FF" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Core Heart Shape -->
  <path d="M 32 46 
           C 22 38, 14 30, 14 22 
           A 7.5 7.5 0 0 1 27 18 
           L 32 23 
           L 37 18 
           A 7.5 7.5 0 0 1 50 22 
           C 50 30, 42 38, 32 46 Z" 
        fill="#0B1B2D" 
        stroke="url(#logoGradTealCyan)" 
        stroke-width="2.2" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Medical Plus Symbol inside Heart / Embellishment -->
  <g transform="translate(32, 24)" filter="url(#neonGlow)">
    <rect x="-2" y="-6" width="4" height="12" rx="1.5" fill="#00E6B8"/>
    <rect x="-6" y="-2" width="12" height="4" rx="1.5" fill="#00E6B8"/>
  </g>

  <!-- Dynamic ECG Pulse Wave crossing through heart -->
  <path d="M 12 33 
           L 20 33 
           L 24 37 
           L 28 20 
           L 32 41 
           L 36 29 
           L 40 35 
           L 44 33 
           L 52 33" 
        stroke="#00D4FF" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Pulse Active Blip -->
  <circle cx="32" cy="41" r="2" fill="#00E6B8"/>

  <!-- Brand Typography -->
  <text x="70" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#F8FAFC" letter-spacing="-0.5">
    myHealthMate
  </text>
  <rect x="210" y="19" width="36" height="18" rx="4" fill="url(#logoGradTealCyan)" />
  <text x="228" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#06111F" letter-spacing="0.5">
    AI
  </text>
  <text x="71" y="46" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10.5" fill="#00D4FF" letter-spacing="1.2">
    YOUR AI HEALTH COMPANION
  </text>
</svg>
